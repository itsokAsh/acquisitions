version: '3.8'

services:
  # Redis cache service
  redis:
    image: redis:7-alpine
    container_name: acquisitions-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - acquisitions-dev

  # Standard Postgres for local development
  db:
    image: postgres:15-alpine
    container_name: acquisitions-db-local
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neon -d postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - acquisitions-dev

  # Node.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: acquisitions-app-dev
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env.development
    environment:
      # Override URLs for Docker internal networking
      DATABASE_URL: postgresql://neon:password@db:5432/postgres
      REDIS_URL: redis://redis:6379
    volumes:
      # Mount source code for development hot-reload
      - .:/app
      - /app/node_modules
      # Mount logs directory
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - acquisitions-dev
    restart: unless-stopped

networks:
  acquisitions-dev:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
