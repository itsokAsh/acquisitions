name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Opt into Node.js 24 runner execution environment to silence deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME || 'local' }}/acquisitions
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate summary
        if: always() && steps.build.outcome == 'success'
        run: |
          if [ "${{ secrets.DOCKER_USERNAME }}" != "" ]; then
            echo "### 🚀 Docker Image Published" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ secrets.DOCKER_USERNAME }}/acquisitions\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Published Tags:**" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
              if [ ! -z "$tag" ]; then
                echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "### 🛠️ Docker Image Built" >> $GITHUB_STEP_SUMMARY
            echo "The Docker image was successfully built but not pushed because Docker Hub credentials were not configured." >> $GITHUB_STEP_SUMMARY
          fi
