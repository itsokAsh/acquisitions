name: Lint and Format

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

# Opt into Node.js 24 runner execution environment to silence deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Your app can safely keep using Node 20 here!
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier check
        id: prettier
        run: npm run format:check
        continue-on-error: true

      - name: Provide Lint Failure Annotations
        if: steps.eslint.outcome == 'failure'
        run: |
          echo "::error::ESLint validation failed. Please run 'npm run lint:fix' locally to automatically resolve issues."

      - name: Provide Prettier Failure Annotations
        if: steps.prettier.outcome == 'failure'
        run: |
          echo "::error::Prettier formatting check failed. Please run 'npm run format' locally to format files."

      - name: Fail workflow if checks failed
        if: steps.eslint.outcome == 'failure' || steps.prettier.outcome == 'failure'
        run: exit 1
