name: Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: run-tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm test -- --reporters=default --reporters=github-actions

      - name: Upload coverage reports
        if: always() && steps.run-tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Generate Coverage Summary
        if: always() && (steps.run-tests.outcome == 'success' || steps.run-tests.outcome == 'failure')
        run: node scripts/generate-coverage-summary.js
